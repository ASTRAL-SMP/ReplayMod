name: Release

on:
  push:
    branches:
      - stable
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to (re)publish (e.g. v3.0.0). Required for workflow_dispatch."
        required: true
        type: string

# One release run per ref at a time. Newer pushes cancel older in-flight runs
# so we don't burn CI minutes on superseded commits.
concurrency:
  group: release-${{ github.event.inputs.tag || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Resolve release tag
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          event="${{ github.event_name }}"
          if [[ "$event" == "workflow_dispatch" ]]; then
            tag="${{ github.event.inputs.tag }}"
          elif [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            tag="${GITHUB_REF_NAME}"
          else
            # Branch push (stable). Auto-derive tag from version.txt.
            version="$(head -n1 version.txt | tr -d '\r\n[:space:]')"
            if [[ -z "$version" ]]; then
              echo "version.txt is empty, nothing to release" >&2
              echo "tag=" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            tag="v$version"
            # Bail early if the release already exists, so re-pushing stable
            # without a version bump doesn't keep re-uploading.
            if gh api "repos/${GITHUB_REPOSITORY}/releases/tags/$tag" >/dev/null 2>&1; then
              echo "Release $tag already exists; skipping."
              echo "tag=" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            # Tag the *current* default-branch HEAD. Tagging an older commit
            # that has different workflow files than HEAD trips GitHub's
            # GitHub-App protection ("refusing to allow a GitHub App to
            # create or update workflow ... without `workflows` permission")
            # because GITHUB_TOKEN can't grant itself `workflows`. Tagging
            # HEAD avoids that entirely.
            #
            # The downside is that root.gradle.kts derives a versioned suffix
            # ("3.0.0-N-g<sha>") whenever HEAD != version.txt-bump commit; we
            # rename the produced jars to the clean form in the
            # "Collect release artifacts" step below.
            if ! git rev-parse --verify --quiet "refs/tags/$tag" >/dev/null; then
              git config user.name "github-actions[bot]"
              git config user.email "github-actions[bot]@users.noreply.github.com"
              git tag -a "$tag" -m "Release $tag" "${GITHUB_SHA}"
              git push origin "refs/tags/$tag"
            fi
          fi
          if [[ -z "$tag" ]]; then
            echo "Could not resolve release tag" >&2
            exit 1
          fi
          if [[ "$tag" != v* ]]; then
            echo "Release workflow expects a v-prefixed tag, got '$tag'" >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      # ---- Build (only when we actually have something to release) ----------

      - name: Cache Gradle / loom
        if: steps.release.outputs.tag != ''
        uses: actions/cache@v4
        with:
          # Loom downloads MC + decompilation output here; missing this turns a
          # ~3 minute build into a ~10 minute one.
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            .gradle/loom-cache
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', 'gradle.properties', 'libs/ReplayStudio/**/*.gradle*') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Cache Windows native encoder DLL
        if: steps.release.outputs.tag != ''
        id: dll-cache
        uses: actions/cache@v4
        with:
          path: native/replaymod-native-encoder/build/windows/replaymod_native_encoder.dll
          key: native-encoder-dll-${{ hashFiles('native/replaymod-native-encoder/**') }}

      - name: Install Nix
        if: steps.release.outputs.tag != ''
        uses: DeterminateSystems/nix-installer-action@v14

      - name: Cache Nix store
        if: steps.release.outputs.tag != ''
        uses: DeterminateSystems/magic-nix-cache-action@v8

      - name: Build ReplayMod jars (1.19.4 + 1.21.4 in parallel)
        if: steps.release.outputs.tag != ''
        run: |
          rm -rf versions/1.19.4/build/libs versions/1.21.4/build/libs
          # --parallel: run 1.19.4 / 1.21.4 sub-builds concurrently
          # --build-cache: reuse compilation outputs from cached Gradle dirs
          # --configuration-cache: skip configuration on cached graphs
          nix develop --command bash -lc './gradlew \
            --no-daemon --parallel --build-cache --configuration-cache \
            $REPLAYMOD_GRADLE_TOOLCHAINS \
            :1.19.4:bundleJar :1.21.4:bundleJar'

      - name: Build native Windows encoder DLL
        if: steps.release.outputs.tag != '' && steps.dll-cache.outputs.cache-hit != 'true'
        run: nix develop --command native/replaymod-native-encoder/build-windows.sh

      - name: Collect release artifacts (rename to clean version)
        if: steps.release.outputs.tag != ''
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ci-artifacts
          # The release tag is "v<version>" (e.g. v3.0.0); strip the "v" to
          # match the jar version that root.gradle.kts uses when version.txt
          # matches HEAD. Whatever Gradle produced (potentially with a
          # "-<n>-g<sha>" suffix) gets copied out under the clean name.
          version="${{ steps.release.outputs.tag }}"
          version="${version#v}"
          shopt -s nullglob
          for libdir in versions/1.19.4/build/libs versions/1.21.4/build/libs; do
            mc="$(basename "$(dirname "$(dirname "$libdir")")")"
            picked=()
            for f in "$libdir"/replaymod-${mc}-*.jar; do
              case "$f" in
                *-sources.jar|*-obf.jar) ;;
                *) picked+=("$f") ;;
              esac
            done
            if [[ ${#picked[@]} -ne 1 ]]; then
              echo "Expected exactly one publishable jar in $libdir, found ${#picked[@]}:" >&2
              ls -la "$libdir" >&2
              exit 1
            fi
            cp -v "${picked[0]}" "ci-artifacts/replaymod-${mc}-${version}.jar"
          done
          cp native/replaymod-native-encoder/build/windows/replaymod_native_encoder.dll ci-artifacts/
          count="$(find ci-artifacts -type f | wc -l)"
          if [[ "$count" -ne 3 ]]; then
            echo "Expected 3 release artifacts (1.19.4 jar, 1.21.4 jar, dll) but found $count:" >&2
            ls -lh ci-artifacts >&2
            exit 1
          fi
          ls -lh ci-artifacts

      - name: Publish GitHub Release
        if: steps.release.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ steps.release.outputs.tag }}"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            printf 'Automated ReplayMod release for %s.\n\nThis release contains:\n- ReplayMod jar for Minecraft 1.19.4 (Fabric)\n- ReplayMod jar for Minecraft 1.21.4 (Fabric)\n- Native Windows encoder DLL (`replaymod_native_encoder.dll`)\n' "$tag" > release-notes.md
            gh release create "$tag" --title "$tag" --notes-file release-notes.md
          fi
          gh release upload "$tag" ci-artifacts/* --clobber
